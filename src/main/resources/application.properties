spring.application.name=practice-room

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/practice_room}
spring.datasource.username=${DB_USERNAME:practice_user}
spring.datasource.password=${DB_PASSWORD:practice_local_password}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
